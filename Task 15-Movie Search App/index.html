<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <i class="fa-solid fa-film"></i>
                Movie Search
            </h1>
            <p>Search your favorite movies and save them to your favorites.</p>
        </header>
        <section class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Search a movie...">
            <button id="searchBtn">
                <i class="fa-solid fa-magnifying-glass"></i>
                Search
            </button>
        </section>
        <section id="loading" class="loading hidden">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p>Searching movies...</p>
        </section>
        <section id="message" class="message hidden">
            <i class="fa-solid fa-circle-info"></i>
            <p>No movie found.</p>
        </section>
        <section id="moviesContainer" class="movies-grid">
            <!-- Movies will appear here -->
        </section>
    </div>

    <div id="movieModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modalBody">
            
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
