<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your income and expenses</p>
            </div>
            <div class="header-icon">
                <i class="fa-solid fa-wallet"></i>
            </div>
        </header>

        <section class="summary-grid">
            <div class="summary-card balance-card">
                <div class="summary-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <span>Balance</span>
                    <h2 id="balance">$0.00</h2>
                </div>
            </div>

            <div class="summary-card income-card">
                <div class="summary-icon">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>
                <div>
                    <span>Total Income</span>
                    <h2 id="totalIncome">$0.00</h2>
                </div>
            </div>

            <div class="summary-card expense-card">
                <div class="summary-icon">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                </div>
                <div>
                    <span>Total Expenses</span>
                    <h2 id="totalExpenses">$0.00</h2>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="section-heading">
                <h2>Add Transaction</h2>
                <p>Record your income or expenses</p>
            </div>

            <form id="transactionForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Grocery shopping"
                        required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="0.00"
                        min="0.01"
                        step="0.01"
                        required>
                </div>

                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input
                        type="date"
                        id="date"
                        required>
                </div>

                <button type="submit" class="add-btn">
                    <i class="fa-solid fa-plus"></i>
                    Add Transaction
                </button>
            </form>
        </section>

        <section class="transactions-section">
            <div class="section-heading">
                <div>
                    <h2>Transactions</h2>
                    <p id="transactionCount">0 transactions</p>
                </div>
            </div>

            <div class="filters">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search transactions...">
                </div>

                <select id="typeFilter">
                    <option value="all">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expenses</option>
                </select>

                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Salary">Salary</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div id="transactionsContainer" class="transactions-container"></div>

            <div id="emptyState" class="empty-state">
                <i class="fa-solid fa-receipt"></i>
                <h3>No Transactions Yet</h3>
                <p>Add your first transaction to start tracking your money.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
