<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="app">
            <div class="header">
                <div class="icon">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
                <h1>QR Code Generator</h1>
                <p>Generate a QR code from any text or URL</p>
            </div>

            <div class="form-section">
                <label for="textInput">Enter text or URL</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-link"></i>
                    <input
                        type="text"
                        id="textInput"
                        placeholder="https://example.com">
                </div>

                <label for="sizeInput">QR Code Size</label>
                <select id="sizeInput">
                    <option value="150">150 × 150</option>
                    <option value="200" selected>200 × 200</option>
                    <option value="250">250 × 250</option>
                    <option value="300">300 × 300</option>
                </select>

                <button id="generateBtn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Generate QR Code
                </button>
            </div>

            <div id="errorMessage" class="error-message hidden">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span></span>
            </div>

            <section id="qrSection" class="qr-section hidden">
                <div id="qrCode"></div>

                <div class="qr-actions">
                    <button id="downloadBtn">
                        <i class="fa-solid fa-download"></i>
                        Download
                    </button>

                    <button id="clearBtn">
                        <i class="fa-solid fa-trash"></i>
                        Clear
                    </button>
                </div>
            </section>

            <div id="emptyState" class="empty-state">
                <i class="fa-solid fa-qrcode"></i>
                <h2>Your QR Code Will Appear Here</h2>
                <p>Enter some text or a URL above to generate your QR code.</p>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
