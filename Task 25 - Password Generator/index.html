<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="app">
            <div class="header">
                <div class="header-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1>Password Generator</h1>
                <p>Create strong and secure passwords instantly</p>
            </div>

            <div class="password-display">
                <input
                    type="text"
                    id="passwordOutput"
                    placeholder="Your password will appear here"
                    readonly>
                <button id="copyBtn" title="Copy password">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <div id="copyMessage" class="copy-message hidden">
                Password copied!
            </div>

            <div class="strength-section">
                <div class="strength-header">
                    <span>Password Strength</span>
                    <strong id="strengthText">None</strong>
                </div>

                <div class="strength-bar">
                    <span id="strengthIndicator"></span>
                </div>
            </div>

            <div class="options-section">
                <div class="section-heading">
                    <h2>Password Options</h2>
                </div>

                <div class="length-section">
                    <div class="option-header">
                        <label for="length">Password Length</label>
                        <span id="lengthValue">16</span>
                    </div>

                    <input
                        type="range"
                        id="length"
                        min="6"
                        max="40"
                        value="16">
                </div>

                <div class="checkbox-grid">
                    <label class="checkbox-option">
                        <input
                            type="checkbox"
                            id="uppercase"
                            checked>
                        <span class="custom-checkbox">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        <span>Uppercase Letters</span>
                    </label>

                    <label class="checkbox-option">
                        <input
                            type="checkbox"
                            id="lowercase"
                            checked>
                        <span class="custom-checkbox">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        <span>Lowercase Letters</span>
                    </label>

                    <label class="checkbox-option">
                        <input
                            type="checkbox"
                            id="numbers"
                            checked>
                        <span class="custom-checkbox">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        <span>Numbers</span>
                    </label>

                    <label class="checkbox-option">
                        <input
                            type="checkbox"
                            id="symbols"
                            checked>
                        <span class="custom-checkbox">
                            <i class="fa-solid fa-check"></i>
                        </span>
                        <span>Symbols</span>
                    </label>
                </div>
            </div>

            <button id="generateBtn" class="generate-btn">
                <i class="fa-solid fa-rotate"></i>
                Generate Password
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
