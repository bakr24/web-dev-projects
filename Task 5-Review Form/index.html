<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testimonial Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="stars">★★★★★</div>

      <img src="https://i.pravatar.cc/150?img=32" alt="Profile" />

      <h2>Sarah Johnson</h2>

      <h4>UI/UX Designer</h4>

      <p>
        "This platform completely changed the way our team works. Everything is
        clean, simple, and incredibly easy to use."
      </p>

      <button id="likeBtn">❤️ Like Review</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
